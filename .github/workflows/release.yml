# Publie une release signée de ReelsGuard.
#
# Deux déclencheurs :
#  - automatique : à chaque push sur main qui touche la version ou ce workflow,
#    la release vX.Y.Z est créée ; si elle existe déjà sur un autre commit, elle est
#    reconstruite sur le nouveau commit (tag déplacé, APK remplacé) ;
#  - manuel : Releases → Draft a new release → tag vX.Y.Z → Publish release.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   RG_KEYSTORE_B64       keystore de signature encodé en base64
#   RG_KEYSTORE_PASSWORD  mot de passe du keystore (et de la clé)
#   RG_KEY_ALIAS          (facultatif) alias de la clé, « reelsguard » par défaut
name: Release

on:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
      - .github/workflows/release.yml
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Version et tag
        id: v
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            if [ "${TAG#v}" != "$VERSION" ]; then
              echo "::error::Le tag $TAG ne correspond pas à versionName ($VERSION) dans app/build.gradle.kts"
              exit 1
            fi
          else
            TAG="v$VERSION"
            REMOTE=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
            if [ "$REMOTE" = "$GITHUB_SHA" ]; then
              echo "La release $TAG est déjà à jour : rien à publier."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            elif [ -n "$REMOTE" ]; then
              echo "La release $TAG existe sur un autre commit : elle sera reconstruite sur $GITHUB_SHA."
              echo "replace=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Version $VERSION · tag $TAG"

      - name: Récupérer la clé de signature
        if: steps.v.outputs.skip != 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret RG_KEYSTORE_B64 manquant : impossible de signer la release."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RG_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        if: steps.v.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.v.outputs.skip != 'true'
        with:
          gradle-version: "8.7"

      - name: Compiler (release signée)
        if: steps.v.outputs.skip != 'true'
        shell: bash
        env:
          RG_KEYSTORE_PASSWORD: ${{ secrets.RG_KEYSTORE_PASSWORD }}
          RG_KEY_ALIAS: ${{ secrets.RG_KEY_ALIAS }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
          APK="ReelsGuard-v$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Remonter les erreurs
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          grep -E "^e: |error:|ERROR:|AAPT" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Notes de version depuis CHANGELOG.md
        if: steps.v.outputs.skip != 'true'
        shell: bash
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo "**Installation** : télécharge \`$APK\` depuis ton téléphone, puis suis le [guide d'installation](https://github.com/${GITHUB_REPOSITORY}#installation)."
            echo
            echo "SHA-256 : \`$(cut -d' ' -f1 "$APK.sha256")\`"
          } >> notes.md

      - name: Déplacer le tag sur ce commit (même version republiée)
        if: steps.v.outputs.replace == 'true'
        shell: bash
        run: git push --force origin "$GITHUB_SHA:refs/tags/$TAG"

      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.skip != 'true'
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ReelsGuard v${{ env.VERSION }}
          body_path: notes.md
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          make_latest: true
          overwrite_files: true
