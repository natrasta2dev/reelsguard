# Branche ReelGuardFamille : publie l'APK signé de l'édition Famille.
#
# À chaque push sur la branche qui touche l'app ou ce workflow, la release « famille-vX.Y.Z »
# (versionName de la variante famille dans app/build.gradle.kts) est créée, ou reconstruite si elle
# existe déjà sur un autre commit. Elle n'est jamais marquée « dernière release », pour ne pas
# remplacer l'édition perso publiée depuis main.
#
# Secrets requis : RG_KEYSTORE_B64, RG_KEYSTORE_PASSWORD, RG_KEY_ALIAS (facultatif).
name: Release Famille

on:
  push:
    branches: [ReelGuardFamille]
    paths:
      - app/**
      - CHANGELOG-FAMILLE.md
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: release-famille
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version et tag
        id: v
        shell: bash
        run: |
          VERSION=$(awk '/create\("famille"\)/{f=1} f && /versionName/{match($0,/"[^"]+"/); print substr($0,RSTART+1,RLENGTH-2); exit}' app/build.gradle.kts)
          [ -n "$VERSION" ] || { echo "::error::versionName de la variante famille introuvable"; exit 1; }
          TAG="famille-v$VERSION"
          REMOTE=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ "$REMOTE" = "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$REMOTE" ]; then
            echo "replace=true" >> "$GITHUB_OUTPUT"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Famille $VERSION · tag $TAG"

      - name: Récupérer la clé de signature
        if: steps.v.outputs.skip != 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RG_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::Secret RG_KEYSTORE_B64 manquant"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RG_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        if: steps.v.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.v.outputs.skip != 'true'
        with:
          gradle-version: "8.7"

      - name: Compiler (Famille, release signée)
        if: steps.v.outputs.skip != 'true'
        shell: bash
        env:
          RG_KEYSTORE_PASSWORD: ${{ secrets.RG_KEYSTORE_PASSWORD }}
          RG_KEY_ALIAS: ${{ secrets.RG_KEY_ALIAS }}
        run: |
          set -o pipefail
          gradle assembleFamilleRelease --no-daemon 2>&1 | tee build.log
          APK="ReelsGuard-Famille-v$VERSION.apk"
          cp app/build/outputs/apk/famille/release/app-famille-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Remonter les erreurs
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          grep -E "^e: |error:|ERROR:|AAPT" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Notes de version
        if: steps.v.outputs.skip != 'true'
        shell: bash
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG-FAMILLE.md > notes.md
          {
            echo
            echo "---"
            echo "**ReelsGuard Famille** — édition contrôle parental. Télécharge \`$APK\` sur le téléphone de l'enfant."
            echo
            echo "SHA-256 : \`$(cut -d' ' -f1 "$APK.sha256")\`"
          } >> notes.md

      - name: Déplacer le tag sur ce commit
        if: steps.v.outputs.replace == 'true'
        shell: bash
        run: git push --force origin "$GITHUB_SHA:refs/tags/$TAG"

      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.skip != 'true'
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ReelsGuard Famille v${{ env.VERSION }}
          body_path: notes.md
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          make_latest: false
          overwrite_files: true
