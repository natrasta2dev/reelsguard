name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compiler l'APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Remonter les erreurs
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|ERROR:|AAPT" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReelsGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReelsGuard-apk
          path: ReelsGuard.apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ReelsGuard build ${{ github.run_number }}
          body: APK compilé automatiquement depuis ${{ github.sha }}.
          files: ReelsGuard.apk
          make_latest: true
